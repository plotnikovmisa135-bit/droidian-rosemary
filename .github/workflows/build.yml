name: Build Halium 13 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout adaptation files
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      - name: Clone Halium 13 kernel
        run: |
          git clone --depth=1 \
            --branch rosemary-13 \
            https://github.com/gabutgadungan/android_kernel_xiaomi_rosemary.git \
            kernel

      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make rosemary_defconfig

          ./scripts/config --enable NAMESPACES
          ./scripts/config --enable CGROUPS
          ./scripts/config --enable DEVTMPFS
          ./scripts/config --enable DEVTMPFS_MOUNT

          make olddefconfig

          echo "=== Important configuration ==="
          grep -E \
            'CONFIG_(NAMESPACES|CGROUPS|DEVTMPFS|DEVTMPFS_MOUNT)=' \
            .config
 - name: Check DVFSRC header
        working-directory: kernel
        run: |
          echo "Searching for header..."
          find . -type f -name 'helio-dvfsrc-qos.h' -print

          echo "Checking DVFSRC directory..."
          ls -la drivers/devfreq/helio-dvfsrc-v3/

      - name: Fix DVFSRC include path
        working-directory: kernel
        run: |
          echo 'ccflags-y += -I$(src)' >> drivers/devfreq/helio-dvfsrc-v3/Makefile
          echo "=== DVFSRC Makefile ==="
          cat drivers/devfreq/helio-dvfsrc-v3/Makefile

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs modules

      - name: Show build output
        working-directory: kernel
        run: |
          echo "=== Kernel ==="
          ls -lh arch/arm64/boot/Image*
          
          echo
          echo "=== Device trees ==="
          find arch/arm64/boot/dts -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print

          echo
          echo "=== Modules ==="
          find . -name '*.ko' -type f | head -50

      - name: Collect kernel artifacts
        run: |
          mkdir -p out

          cp kernel/arch/arm64/boot/Image.gz \
            out/Image.gz

          if [ -f kernel/arch/arm64/boot/Image ]; then
            cp kernel/arch/arm64/boot/Image \
              out/Image
          fi

          find kernel/arch/arm64/boot/dts \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents {} out/ \;

          find kernel \
            -type f \
            -name '*.ko' \
            -exec cp --parents {} out/ \;

          cp kernel/.config out/kernel.config

          git -C kernel rev-parse HEAD > out/kernel-commit.txt

      - name: Package artifacts
        run: |
          tar -czf rosemary-halium13-kernel.tar.gz -C out .

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-halium13-kernel
          path: |
            rosemary-halium13-kernel.tar.gz
            out/Image
            out/Image.gz
            out/kernel.config
            out/kernel-commit.txt
            out/arch/
          if-no-files-found: error

