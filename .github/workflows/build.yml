name: Build Rosemary Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            gcc-aarch64-linux-gnu \
            git libssl-dev libelf-dev \
            lz4 python3 rsync

      - name: Clone kernel
        run: |
          git clone \
            --depth=1 \
            --branch rosemary-13 \
            https://github.com/gabutgadungan/android_kernel_xiaomi_rosemary.git \
            kernel

      - name: Configure
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make rosemary_defconfig
          make olddefconfig

      - name: Build
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j"$(nproc)" Image.gz dtbs

      - name: Verify
        working-directory: kernel
        run: |
          test -f arch/arm64/boot/Image.gz

          echo "=== SUCCESS ==="
          ls -lh arch/arm64/boot/Image.gz

          echo "=== DTBs ==="
          find arch/arm64/boot/dts \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-kernel
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/arch/arm64/boot/dts/**/*.dtbo
