name: Build Rosemary Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libssl-dev \
            libelf-dev \
            lz4 \
            python3 \
            rsync

      - name: Clone kernel
        run: |
          git clone \
            --depth=1 \
            --branch rosemary-13 \
            https://github.com/gabutgadungan/android_kernel_xiaomi_rosemary.git \
            kernel

      - name: Verify source tree
        working-directory: kernel
        run: |
          test -f drivers/devfreq/helio-dvfsrc-v3/helio-dvfsrc-qos.h

          echo "DVFSRC header exists"

          echo "=== ksm_flock references ==="
          grep -Rns \
            -E 'ksm_flock[[:space:]]*\(' \
            include block drivers \
            2>/dev/null || true

      - name: Fix DVFSRC headers
        working-directory: kernel
        run: |
          sed -i \
            's/#include <helio-dvfsrc-qos\.h>/#include "helio-dvfsrc-qos.h"/g' \
            drivers/devfreq/helio-dvfsrc-v3/*.c

          echo "=== DVFSRC includes ==="
          grep -Rni 'helio-dvfsrc-qos.h' \
            drivers/devfreq/helio-dvfsrc-v3/

      - name: Disable broken block crypto
        working-directory: kernel
        run: |
          ./scripts/config --disable BLK_CRYPTO
          ./scripts/config --disable BLK_INLINE_ENCRYPTION
          ./scripts/config --disable BLK_INLINE_ENCRYPTION_FALLBACK

      - name: Disable block crypto
        working-directory: kernel
        run: |
          echo "=== Before ==="
          grep -E 'CONFIG_(BLK_CRYPTO|BLK_INLINE_ENCRYPTION|FS_ENCRYPTION)' .config || true

          ./scripts/config --disable BLK_CRYPTO
          ./scripts/config --disable BLK_INLINE_ENCRYPTION
          ./scripts/config --disable BLK_INLINE_ENCRYPTION_FALLBACK

          make olddefconfig

          echo "=== After ==="
          grep -E 'CONFIG_(BLK_CRYPTO|BLK_INLINE_ENCRYPTION|BLK_INLINE_ENCRYPTION_FALLBACK|FS_ENCRYPTION)' .config || true

          echo "=== Checking whether blk-crypto is configured ==="
          grep -n "blk-crypto" block/Makefile
            
      - name: Inspect keyslot manager
        working-directory: kernel
        run: |
          echo "=== ksm_flock ==="
          grep -RniE 'ksm_flock|keyslot_manager' \
            include/linux block drivers \
            --exclude-dir=.git \
            2>/dev/null | head -200

          echo
          echo "=== crypto/keyslot files ==="
          find . -type f \
            \( -iname '*keyslot*' -o -iname '*blk-crypto*' \) \
            -print

          echo
          echo "=== relevant config ==="
          grep -E \
            'CONFIG_(BLK_CRYPTO|BLK_INLINE_ENCRYPTION|FS_ENCRYPTION)' \
            .config || true
            
      - name: Inspect keyslot manager
        working-directory: kernel
        run: |
          echo "=== keyslot-manager.h ==="
          sed -n '70,125p' include/linux/keyslot-manager.h

          echo
          echo "=== ksm_flock definitions ==="
          grep -Rns \
            -E '^[[:space:]]*(static[[:space:]]+)?(inline[[:space:]]+)?(void|int)[[:space:]]+ksm_flock[[:space:]]*\(' \
            . \
            --exclude-dir=.git \
            2>/dev/null || true

          echo
          echo "=== keyslot files ==="
          find . -type f \
            \( -iname '*keyslot*' -o -iname '*blk-crypto*' \) \
            -print

      - name: Configure
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make rosemary_defconfig
          make olddefconfig
      - name: Verify crypto configuration
        working-directory: kernel
        run: |
          echo "CONFIG_BLK_CRYPTO:"
          grep '^CONFIG_BLK_CRYPTO=' .config || true

          echo
          echo "blk-crypto Makefile:"
          grep -n -C 3 'blk-crypto' block/Makefile || true
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs

      - name: Verify
        working-directory: kernel
        run: |
          test -f arch/arm64/boot/Image.gz

          echo "=== SUCCESS ==="
          ls -lh arch/arm64/boot/Image.gz

          echo
          echo "=== DTBs ==="
          find arch/arm64/boot/dts \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rosemary-kernel
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: error
