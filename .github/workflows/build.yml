name: Droidian Installer Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adaptation files
        uses: actions/checkout@v4

      - name: Install Base System Tools
        run: |
          sudo apt update
          sudo apt install -y debos qemu-user-static python3-parted python3-pip git python3-setuptools python3-wheel

      - name: Setup Droidian Build Environment
        run: |
          git clone https://github.com/droidian-releng/droidian-build-tools.git tools
          cd tools && sudo ./setup.sh || true
          cd ..

      - name: Clone Halium 13 Kernel Source
        run: |
          git clone https://github.com --depth=1 kernel

      - name: Configure Kernel Defconfig
        run: |
          cd kernel
          make rosemary_defconfig ARCH=arm64
          sed -i 's/# CONFIG_NAMESPACES is not set/CONFIG_NAMESPACES=y/' .config
          sed -i 's/# CONFIG_CGROUPS is not set/CONFIG_CGROUPS=y/' .config
          sed -i 's/# CONFIG_DEVTMPFS is not set/CONFIG_DEVTMPFS=y/' .config
          cp .config arch/arm64/configs/rosemary_defconfig
          cd ..

      - name: Execute Droidian Image Generation
        run: |
          # Используем официальные бинарники сборщика из репозитория инструментов
          ./tools/bin/droidian-releng --component=main --architecture=arm64 --device=rosemary --kernel-dir=./kernel build || true

      - name: Upload Flashable Components
        uses: actions/upload-artifact@v4
        with:
          name: Droidian-rosemary-Halium13
          path: |
            out/*.zip
            out/*.img
            *.zip
            *.img
